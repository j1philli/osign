name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same PR aren't useful, so cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Kotlin Toolchain keeps its distribution, JDKs, and dependencies here.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml', '**/module.yaml', '*.module-template.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      - name: Test
        run: ./kotlin test

      - name: Build web app
        run: ./build-web.sh release
